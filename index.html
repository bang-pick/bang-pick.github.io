<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f31864" />
    <meta name="description" content="BanG Dream! 최애캐를 기록하고 공유해보세요!" />
    <title>방픽!</title>
    <link rel="stylesheet" href="./styles/base.css?v=20261004-1" />
    <link rel="stylesheet" href="./styles/picker.css?v=20261004-1" />
    <link rel="stylesheet" href="./styles/poster.css?v=20261004-1" />
    <link rel="stylesheet" href="./styles/responsive.css?v=20261004-1" />
    <link rel="icon" href="./assets/favicon.ico" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="방픽!" />
    <meta property="og:description" content="BanG Dream! 최애캐를 기록하고 공유해보세요!" />
    <meta property="og:image" content="https://bang-pick.github.io/assets/images/main-1.webp" />
    <meta property="og:url" content="https://bang-pick.github.io/" />
    <meta property="og:site_name" content="방픽!" />

    <script src="./app.js?v=20261004-1" type="module"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="logo" href="#top" aria-label="bandori pick 홈">
        방픽<img src="./assets/exclamation.svg" alt="" />
      </a>
      <nav aria-label="주 메뉴">
        <a class="nav-link active" href="#pick">최애표</a>
        <a class="nav-link" href="#tools">
           관계도<span class="soon">준비 중</span>
        </a>
      </nav>
    </header>

    <main id="top">
      <section class="intro" id="pick">
        <div class="intro-visual" aria-hidden="true">
          <img class="active" src="./assets/images/main-1.webp" alt="" />
        </div>
        <div class="intro-copy">
          <h2>BanG Dream!</h2>
          <h1>my Pick<img src="./assets/exclamation.svg" alt="" /></h1>
          <p class="intro-description">최애캐를 기록하고 공유해보세요!</p>
        </div>
      </section>

      <div class="selection-layout">
        <section class="picked-section" id="picked">
          <div class="section-heading picked-heading">
            <h2>내가 고른 최애</h2>
            <button class="text-button" id="clear-picks" type="button">전체 삭제</button>
          </div>
          <div class="picked-panel">
            <div class="poster-preview-wrap">
              <label class="nickname-field" for="nickname">
                <span>표에 표시할 닉네임</span>
                <input id="nickname" type="text" maxlength="24" placeholder="닉네임 입력" autocomplete="nickname" />
              </label>
              <div class="rank-editor" id="rank-editor" hidden></div>
              <div id="poster-preview" aria-label="선택한 캐릭터 최애표 미리보기" hidden></div>
              <div class="poster-empty" id="poster-empty">캐릭터를 선택하면 인쇄될 최애표가 여기에 표시됩니다.</div>
            </div>
            <button class="image-button" id="save-image" type="button" disabled>이미지 저장 
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-download preview-icon"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg></button>
          </div>
        </section>

        <section class="workspace" id="character-list">
          <div class="section-heading">
            <h2>최애표 만들기</h2>
          </div>
          <div class="pick-layout">
            <aside class="filters" aria-label="캐릭터 필터">
              <label class="search-box">
                <span class="search-symbol" aria-hidden="true"></span>
                <input id="search" type="search" placeholder="이름으로 찾기" autocomplete="off" />
              </label>
              <select id="band-filter" class="band-select" aria-label="밴드 필터"></select>
            </aside>

            <div class="roster">
              <div class="roster-toolbar">
                <div class="scope-tabs" role="tablist" aria-label="최애 범위">
                  <button class="scope-tab selected" data-scope="all" role="tab" aria-selected="true">베스트 9</button>
                  <button class="scope-tab" data-scope="band" role="tab" aria-selected="false">밴드별 최애</button>
                  <button class="scope-tab" data-scope="couples" role="tab" aria-selected="false">최애컾</button>
                </div>
              </div>
              <div class="roster-title">
                <h3 id="roster-title">모든 캐릭터</h3>
                <span id="roster-subtitle">최애 9명을 골라보세요. 0/9명 선택</span>
              </div>
              <div class="couple-selection" id="couple-selection" hidden></div>
              <div id="characters" aria-live="polite"></div>
              <div class="empty-state" id="empty-state" hidden>
                <strong>찾는 캐릭터가 없어요.</strong><span>다른 이름으로 검색해 보세요.</span>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
    <footer>
      <span><b>비공식・비영리 팬 사이트</b><br />©BanG Dream! Project, Bushiroad All Rights Reserved.</span>
      <a href="https://bang-dream.com/artist/" target="_blank" rel="noopener noreferrer">이미지 출처</a>
    </footer>
  </body>
</html>
