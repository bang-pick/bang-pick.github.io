<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f31864" />
    <meta name="description" content="BanG Dream! 최애캐를 자랑해보세요!" data-i18n-content="meta.pickDescription" />
    <title data-i18n="meta.pickTitle">최애캐 | 방픽!</title>
    <link rel="stylesheet" href="./styles/base.css?v=20261006-5" />
    <link rel="stylesheet" href="./styles/picker.css?v=20261006-2" />
    <link rel="stylesheet" href="./styles/poster.css?v=20261006-10" />
    <link rel="icon" href="./assets/favicon.ico" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="최애캐 | 방픽!" />
    <meta property="og:description" content="BanG Dream! 최애캐를 기록하고 공유해보세요!" />
    <meta property="og:image" content="https://bang-pick.github.io/assets/images/main-2.webp" />
    <meta property="og:url" content="https://bang-pick.github.io/pick.html" />
    <meta property="og:site_name" content="방픽!" />

    <script src="./scripts/layout.js?v=20261006-3" type="module"></script>
    <script src="./scripts/app.js?v=20261006-11" type="module"></script>
  </head>
  <body data-page="pick">
    <header class="topbar" data-shared="header"></header>

    <main>
      <div class="selection-layout">
        <section class="picked-section" id="picked">
          <div class="section-heading picked-heading">
            <h2 data-i18n="pick.selectedHeading">내가 고른 캐릭터</h2>
            <button class="text-button" id="clear-picks" type="button" data-i18n="common.clear">전체 삭제</button>
          </div>
          <div class="picked-panel">
            <div class="poster-preview-wrap">
              <label class="nickname-field" for="nickname">
                <span data-i18n="common.nickname">내 닉네임</span>
                <input id="nickname" type="text" maxlength="24" placeholder="닉네임 입력" data-i18n-placeholder="common.nicknamePlaceholder" autocomplete="nickname" />
              </label>
              <div class="couple-selection" id="couple-selection" hidden>
                <div class="picked-list-heading" data-i18n="pick.couplesHeading">선택한 커플링</div>
                <div class="couple-selection-list" id="couple-selection-list"></div>
              </div>
              <div class="rank-editor" id="rank-editor" hidden>
                <div class="picked-list-heading" data-i18n="pick.rankHeading">순위 조정</div>
                <div class="rank-editor-list" id="rank-editor-list"></div>
              </div>
              <div id="poster-preview" aria-label="선택한 캐릭터 최애표 미리보기" data-i18n-aria="pick.posterLabel"></div>
            </div>
            <button class="image-button" id="save-image" type="button" disabled><span data-i18n="common.saveImage">이미지 저장</span>
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg></button>
          </div>
        </section>

        <section class="workspace" id="character-list">
          <div class="section-heading">
            <h2 data-i18n="pick.chooseHeading">최애캐 고르기</h2>
          </div>
          <div class="scope-tabs" role="group" aria-label="최애표 종류" data-i18n-aria="pick.types">
            <button class="scope-tab selected" data-scope="all" aria-pressed="true" data-i18n="pick.bestTab">베스트 9</button>
            <button class="scope-tab" data-scope="band" aria-pressed="false" data-i18n="pick.bandTab">밴드별 최애캐</button>
            <button class="scope-tab" data-scope="couples" aria-pressed="false" data-i18n="pick.coupleTab">최애 커플</button>
          </div>
          <aside class="filters" aria-label="캐릭터 필터" data-i18n-aria="pick.filters">
            <label class="search-box">
              <span class="search-symbol" aria-hidden="true"></span>
              <input id="search" type="search" placeholder="이름으로 찾기" data-i18n-placeholder="pick.searchPlaceholder" autocomplete="off" />
            </label>
            <select id="band-filter" class="band-select" aria-label="밴드 필터" data-i18n-aria="filter.bandLabel"></select>
          </aside>

          <div class="roster">
            <div class="roster-title">
              <h3 id="roster-title" data-i18n="pick.rosterAll">모든 캐릭터</h3>
              <span id="roster-subtitle">최애 9명을 골라보세요. 0/9명 선택</span>
            </div>
            <div id="characters" aria-live="polite"></div>
            <div class="empty-state" id="empty-state" hidden>
              <strong data-i18n="pick.noResults">찾는 캐릭터가 없어요.</strong><span data-i18n="pick.tryAnother">다른 이름으로 검색해 보세요.</span>
            </div>
          </div>
        </section>
      </div>
    </main>
    <template id="character-card-template">
      <div class="character-card" role="button" tabindex="0">
        <span class="portrait">
          <span class="portrait-initial"></span>
          <img alt="" loading="lazy" />
          <span class="picked-mark" aria-hidden="true"></span>
          <button class="character-form-switch" type="button"></button>
        </span>
        <span class="character-info">
          <span class="character-band"><img alt="" loading="lazy" /></span>
          <span class="character-name"></span>
          <span class="character-sub"><span class="character-japanese"></span> <i>·</i> <span class="character-part"></span></span>
        </span>
      </div>
    </template>
    <template id="poster-template">
      <article class="print-poster">
        <header class="print-poster-header">
          <h2><span class="print-poster-owner"></span><span class="print-poster-title"></span><img src="./assets/exclamation.svg" alt="" /></h2>
        </header>
        <div class="print-poster-content"></div>
        <footer class="print-poster-footer">
          <span>©BanG Dream! Project, Bushiroad All Rights Reserved.</span>
          <span data-i18n="poster.footer">비공식 팬사이트 방픽!에서 생성되었습니다.</span>
        </footer>
      </article>
    </template>
    <footer data-shared="footer"></footer>
    <a class="back-to-top" href="#" aria-label="맨 위로 가기" data-i18n-aria="common.backToTop">↑</a>
  </body>
</html>
